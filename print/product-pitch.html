<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Product pitch worksheet</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>body{background:#fff} .sheet{max-width:800px;margin:24px auto}</style>
</head>
<body>
  <article class="sheet panel">
    <p class="kicker">Jordan Glen School · 3D printing</p>
    <h1>Product pitch</h1>
    <p>Fill this in. It is a classroom worksheet, not a contract.</p>
    <form class="form-grid" onsubmit="event.preventDefault(); print();">
      <label>Name <input name="student"></label>
      <label>Product name <input></label>
      <label>Who has the problem? <input></label>
      <label>The problem <textarea rows="3"></textarea></label>
      <label>Your solution <textarea rows="3"></textarea></label>
      <label>Make and sell, or license? Why? <textarea rows="3"></textarea></label>
      <label>Price, and what the buyer gets <input></label>
      <label>What you will not claim <textarea rows="2">I will not write “patent pending” unless an adult has actually filed an application.</textarea></label>
      <button class="btn primary" type="submit">Print</button>
    </form>
    <p><a href="../index.html#pitch">Back to the course</a></p>
  </article>
</body>
</html>
