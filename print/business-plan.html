<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>One-page business plan</title>
  <link rel="stylesheet" href="../css/styles.css">
  <style>body{background:#fff} .sheet{max-width:800px;margin:24px auto}</style>
</head>
<body>
  <article class="sheet panel">
    <p class="kicker">Grades 7–8</p>
    <h1>One-page business plan</h1>
    <form class="form-grid" onsubmit="event.preventDefault(); print();">
      <label>Student <input></label>
      <label>Customer <input></label>
      <label>Problem <textarea rows="2"></textarea></label>
      <label>Offer <textarea rows="2"></textarea></label>
      <label>Cost to make one (filament, time, packaging, failures) <input></label>
      <label>Price <input></label>
      <label>Path: make and sell, or license <input></label>
      <label>Test with ten people <textarea rows="2"></textarea></label>
      <label>Adult who must approve any real sale or NDA <input></label>
      <button class="btn primary" type="submit">Print</button>
    </form>
    <p><a href="../index.html#business">Back to the course</a></p>
  </article>
</body>
</html>
